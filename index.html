<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <title>My To-do List</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <!-- CSS -->
        <link rel="stylesheet" href="https://unpkg.com/destyle.css@1.0.5/destyle.css">
        <link href="css/style.css" rel="stylesheet">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Gaegu&family=Noto+Sans+KR:wght@100..900&family=Noto+Serif+KR:wght@200..900&display=swap" rel="stylesheet">
    </head>

    <body>
        <main class="todo-app">
            <!-- 제목과 현재 시간 영역 -->
            <header class="app-header">
                <h1>My To-do List</h1>
                <p class="now-time"></p>
            </header>
            
            <div class="app-body">
                <!-- 할 일 입력 영역 -->
                <section class="panel panel-input">
                    <h2 class="panel-title">할 일 쓰기</h2>
                    <!-- 할 일 입력 폼: Enter 키와 버튼 클릭 모두 'submit' 이벤트로 처리된다 -->
                    <form class="todo-form">
                        <input class="todo-input" type="text" maxlength="40" 
                            placeholder="예 : 자바스크립트 복습하기" autocomplete="off">

                        <div class="due-row">
                            <label class="due-label" for="todoDue">완료 날짜ㆍ시간(선택)</label>
                            <input class="todo-due-input" id="todoDue" type="datetime-local">
                        </div>

                        <button class="add-btn" type="submit">추가</button>
                    </form>
                </section>

                <!-- 할 일 목록 영역 -->
                <section class="panel panel-list">
                    <h2 class="panel-title">할 일 목록</h2>
                    <!-- 할 일 목록: li 요소는 JavaScript가 만들어서 넣는다 -->
                    <ul class="todo-list"></ul>

                    <!-- 목록이 비어 있을 때만 보이는 안내 문구 -->
                    <p class="empty-msg">할 일이 없습니다. 추가해 보세요!</p>

                    <div class="todo-footer">
                        <p class="todo-count">남은 할 일 0개</p>
                        <button class="clear-btn" type="button">완료 항목 삭제</button>
                    </div>
                </section>
            </div>
        </main>

        <!-- JavaScript -->
        <script src="js/script.js"></script>
    </body>
</html>
